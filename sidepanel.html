<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Video Merger</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6.5C4 5.11929 5.11929 4 6.5 4H17.5C18.8807 4 20 5.11929 20 6.5V17.5C20 18.8807 18.8807 20 17.5 20H6.5C5.11929 20 4 18.8807 4 17.5V6.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 8.5L16 12L10 15.5V8.5Z" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title-wrap">
          <h1>Flow Video Merger</h1>
          <span class="version-chip">v1.2</span>
        </div>
        <p class="subtitle" data-i18n="app_subtitle">Clip Sequencer &amp; Video Assembler</p>
      </div>
      <div class="lang-switch-wrap" role="group" aria-label="Language / Langue">
        <button id="langEnBtn" class="lang-btn active" type="button" title="English">EN</button>
        <button id="langFrBtn" class="lang-btn" type="button" title="Français">FR</button>
      </div>
    </div>
    
    <div class="group-bar">
      <div class="group-select-wrap">
        <svg class="group-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m20.2 6-17.2 5-.9-2.4c-.3-.8.2-1.8 1-2.1l10-3.6c.8-.3 1.8.2 2.1 1Z"/>
          <path d="m6.2 5.3 3.1 4.3"/>
          <path d="m11.6 3.4 3.1 4.3"/>
          <path d="M3 11h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        </svg>
        <select id="groupSelect" title="Active Sequence / Scene" data-i18n-title="group_select_title"></select>
      </div>
      <button id="newGroupBtn" class="icon-btn" title="Create a new sequence / scene" data-i18n-title="new_scene_title">
        <span class="icon-plus">+</span> <span data-i18n="new_scene_label">Scene</span>
      </button>
    </div>

    <div class="studio-link-wrap">
      <button id="openStudioBtn" class="open-studio-btn" title="Open full-screen web interface with Storyboard &amp; Timeline" data-i18n-title="open_studio_title">
        <svg class="studio-btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 3 21 3 21 9"/>
          <polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
        <span class="studio-btn-text" data-i18n="open_studio_btn">Web Studio Storyboard &amp; Timeline</span>
        <span class="studio-btn-badge" data-i18n="open_studio_badge">Fullscreen ↗</span>
      </button>
    </div>
  </header>

  <section class="toolbar-card">
    <div class="toolbar-row">
      <button id="scanFlowBtn" class="primary-btn" title="Scan and automatically capture videos from Google Flow tab" data-i18n-title="capture_flow_title">
        <svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span data-i18n="capture_flow_clips">Capture Flow clips</span>
      </button>
      <label for="localFileInput" class="secondary-btn file-label" title="Import .mp4 / .webm video clips from your computer" data-i18n-title="import_files_title">
        <svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="12" y2="11"/>
          <line x1="15" y1="14" x2="12" y2="11"/>
        </svg>
        <span data-i18n="import_files_btn">+ Files</span>
      </label>
      <input type="file" id="localFileInput" accept="video/mp4,video/webm,video/quicktime" multiple hidden />
    </div>

    <div class="sort-row">
      <div class="sort-label-wrap">
        <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 16 4 4 4-4"/>
          <path d="M7 20V4"/>
          <path d="m21 8-4-4-4 4"/>
          <path d="M17 4v16"/>
        </svg>
        <label for="sortModeSelect" data-i18n="sort_label">Order:</label>
      </div>
      <div class="select-wrap sort-select-wrap">
        <select id="sortModeSelect">
          <option value="smart" selected data-i18n="sort_smart">Smart Order (Narrative &amp; Chrono)</option>
          <option value="explicit_scene" data-i18n="sort_explicit">Scene Numbering (Scene 1, 2...)</option>
          <option value="narrative" data-i18n="sort_narrative">Narrative Arc (Intro → Climax → End)</option>
          <option value="temporal" data-i18n="sort_temporal">Time Progression (Morning → Night)</option>
          <option value="dom" data-i18n="sort_dom">Flow Canvas Order (Top → Bottom)</option>
          <option value="chronological" data-i18n="sort_chronological">Chronological Order (1 → N)</option>
          <option value="natural" data-i18n="sort_natural">Natural Name Sort (01, 02...)</option>
          <option value="reverse" data-i18n="sort_reverse">Reverse Order</option>
        </select>
      </div>
      <button id="applySortBtn" class="ghost-btn" title="Reapply sort" data-i18n-title="sort_title" data-i18n="sort_btn">Sort</button>
    </div>
  </section>

  <section class="sequence-section">
    <div class="section-header">
      <div class="section-title-wrap">
        <h2 data-i18n="clips_in_sequence">Clips in Sequence</h2>
        <span class="count-pill"><span id="clipCount">0</span></span>
      </div>
      <div class="header-actions">
        <span id="totalDurationBadge" class="badge">0.0s</span>
        <button id="clearAllBtn" class="danger-link" title="Clear current sequence" data-i18n-title="clear_btn_title">
          <svg class="clear-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          <span data-i18n="clear_btn">Clear</span>
        </button>
      </div>
    </div>

    <div class="hint-card">
      <svg class="hint-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span class="hint-text" data-i18n="hint_text">
        Drag and drop to rearrange order <strong>#01 → #N</strong>. Supports 1080p and <strong>/boost 4K</strong>.
      </span>
    </div>

    <div id="clipList" class="clip-list"></div>
  </section>

  <!-- Lecteur de prévisualisation de la séquence -->
  <section id="previewSection" class="preview-card hidden">
    <div class="preview-header">
      <div class="preview-title-row">
        <span class="live-dot"></span>
        <h3 data-i18n="continuous_preview">Continuous Preview</h3>
      </div>
      <button id="closePreviewBtn" class="close-btn" title="Close preview" data-i18n-title="close_preview_title">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="video-player-wrap">
      <video id="sequencePreviewPlayer" controls playsinline></video>
    </div>
    <p id="previewNowPlaying" class="preview-caption"></p>
  </section>

  <footer class="export-footer">
    <div class="export-settings">
      <div class="setting-field">
        <label for="resolutionSelect">
          <svg class="field-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span data-i18n="output_format">Output Format</span>
        </label>
        <div class="select-wrap">
          <select id="resolutionSelect">
            <option value="auto" data-i18n="format_auto">Auto (Source)</option>
            <option value="3840x2160" data-i18n="format_4k_land">4K Landscape (3840×2160)</option>
            <option value="1920x1080" data-i18n="format_1080p_land">1080p Landscape (1920×1080)</option>
            <option value="1280x720" data-i18n="format_720p_land">720p Landscape (1280×720)</option>
            <option value="2160x3840" data-i18n="format_4k_vert">4K Vertical Shorts (2160×3840)</option>
            <option value="1080x1920" data-i18n="format_1080p_vert">1080p Vertical Reels (1080×1920)</option>
          </select>
        </div>
      </div>
      <div class="setting-field">
        <label for="transitionSelect">
          <svg class="field-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
          </svg>
          <span data-i18n="transition_label">Transition</span>
        </label>
        <div class="select-wrap">
          <select id="transitionSelect">
            <option value="0" data-i18n="trans_cut">Direct cut</option>
            <option value="0.25" data-i18n="trans_dissolve_soft">Soft dissolve (0.25s)</option>
            <option value="0.5" data-i18n="trans_dissolve_cine">Cinematic dissolve (0.5s)</option>
          </select>
        </div>
      </div>
    </div>

    <div id="progressContainer" class="progress-container hidden">
      <div class="progress-top">
        <span id="progressStatus" data-i18n="prep_clips">Preparing clips...</span>
        <span id="progressPercent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>
    </div>

    <div class="footer-buttons">
      <button id="previewSeqBtn" class="secondary-btn preview-btn" disabled>
        <svg class="btn-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span data-i18n="preview_btn">Preview</span>
      </button>
      <button id="mergeExportBtn" class="merge-btn" disabled>
        <svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m22 8-6 4 6 4V8Z"/>
          <rect x="2" y="6" width="14" height="12" rx="2" ry="2"/>
        </svg>
        <span data-i18n="merge_btn">Merge into 1 Video</span>
      </button>
    </div>
  </footer>

  <!-- Canvas caché dédié au moteur d'assemblage vidéo & audio sans coupure -->
  <canvas id="mergerCanvas" class="hidden"></canvas>

  <script src="i18n.js"></script>
  <script src="smart-order.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
